<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About | JW Baum</title>

  <style>
    body {
      margin: 0;
      background: #f7f4ec;
      color: #111;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.75;
      font-size: 18.5px;
    }

    main {
      max-width: 620px;
      margin: 0 auto;
      padding: 72px 22px 88px;
    }

    /* Site header */
    .site-name {
      font-size: clamp(3rem, 9vw, 5.25rem);
      line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 2rem;
    }

    .site-name a {
      text-decoration: none;
      color: #111;
    }

    h1 {
      font-size: clamp(1.9rem, 4.5vw, 2.3rem);
      font-weight: normal;
      margin-bottom: 1.5rem;
    }

    h2 {
      font-size: 1rem;
      font-weight: normal;
      margin-top: 2.5rem;
      margin-bottom: 0.5rem;
      color: #555;
    }

    p {
      margin-bottom: 1.3rem;
    }

    a {
      color: #111;
    }

    /* Portrait */
    .portrait {
      margin: 0 0 2.5rem;
    }

    .portrait img {
      display: block;
      width: 100%;
      max-width: 340px;
      height: auto;
    }

    ul {
      padding-left: 1.2rem;
    }

    li {
      margin-bottom: 0.5rem;
    }

    /* Mobile */
    @media (max-width: 600px) {
      body {
        font-size: 17.5px;
      }

      main {
        padding: 88px 24px 84px;
      }

      .site-name {
        font-size: clamp(3.2rem, 14vw, 4.6rem);
      }

      h1 {
        font-size: clamp(1.7rem, 7vw, 2.1rem);
      }

      .portrait img {
        max-width: 260px;
      }
    }
  </style>
</head>

<body>
  <main>

    <!-- Header -->
    <div class="site-name">
      <a href="/">JW Baum</a>
    </div>

    <h1>About</h1>

    <!-- Image -->
    <div class="portrait">
      <img src="/images/me/jjq1.jpg" alt="The author at the park holding his two toddlers" />
    </div>

   <p>
  My name is Jacob. I created this website to share my learning and my heart and to make friends. If you want to chat or say hello, please email me hello@jwbaum.com. All my social media is linked below.
   </p>

  </main>
</body>
</html>
