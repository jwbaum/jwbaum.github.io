<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | JW Baum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Georgia, serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 1.25rem;
      line-height: 1.65;
      color: #111;
      background: #fff;
    }

    header.site-header {
      margin-bottom: 3rem;
    }

    .site-title {
      font-size: 3rem;
      line-height: 1;
      margin: 0 0 1rem 0;
      font-weight: normal;
    }

    .site-title a {
      color: inherit;
      text-decoration: none;
    }

    nav a,
    .back-link,
    article a {
      color: #111;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    article h1 {
      font-size: 2.1rem;
      line-height: 1.15;
      margin-bottom: 0.25rem;
      font-weight: normal;
    }

    .date {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 2rem;
    }

    article h2 {
      font-size: 1.55rem;
      line-height: 1.25;
      margin-top: 2.75rem;
      margin-bottom: 0.75rem;
      font-weight: normal;
    }

    article h3 {
      font-size: 1.25rem;
      margin-top: 2rem;
      font-weight: normal;
    }

    blockquote {
      border-left: 3px solid #111;
      margin: 2rem 0;
      padding-left: 1rem;
      color: #333;
      font-style: italic;
    }

    .footnotes {
      margin-top: 3rem;
      font-size: 0.92rem;
      border-top: 1px solid #ddd;
      padding-top: 1.25rem;
    }

    .footnotes ol {
      padding-left: 1.25rem;
    }

    .references {
      margin-top: 3rem;
      border-top: 1px solid #ddd;
      padding-top: 1.25rem;
      font-size: 0.95rem;
    }

    footer {
      margin-top: 4rem;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <p class="site-title"><a href="/">JW Baum</a></p>
    <nav>
      <a href="/writing/">Writing</a> ·
      <a href="/reading/">Reading</a> ·
      <a href="/about/">About</a>
    </nav>
  </header>

  <main>
    <p><a class="back-link" href="/writing/">← Back to Writing</a></p>

    <article>
      <h1>{{ page.title }}</h1>

      {% if page.subtitle %}
        <p><em>{{ page.subtitle }}</em></p>
      {% endif %}

      {% if page.date %}
        <p class="date">{{ page.date | date: "%Y-%m-%d" }}</p>
      {% endif %}

      {{ content }}
    </article>
  </main>

  <footer>
    <p>© {{ site.time | date: "%Y" }} JW Baum</p>
  </footer>
</body>
</html>
