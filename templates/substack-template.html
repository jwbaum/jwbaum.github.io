<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Essay Title | JW Baum</title>
  <style>
    body {
      margin: 0;
      background: #f7f4ec;
      color: #111;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.75;
      font-size: 18.5px;
    }

    main {
      max-width: 620px;
      margin: 0 auto;
      padding: 72px 22px 88px;
    }

    /* Large identity (matches homepage) */
    .site-name {
      font-size: clamp(3rem, 9vw, 5.25rem);
      line-height: 1;
      letter-spacing: -0.03em;
      margin-bottom: 2rem;
    }

    .site-name a {
      text-decoration: none;
      color: #111;
    }

    /* Section link */
    .section {
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }

    /* Title */
    h1 {
      font-size: clamp(1.9rem, 4.5vw, 2.3rem);
      font-weight: normal;
      line-height: 1.2;
      margin-bottom: 0.25rem;
    }

    /* Date */
    .date {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 0.6rem;
      display: block;
    }

    /* NEW: original publication note */
    .original {
      font-size: 0.9rem;
      color: #666;
      font-style: italic;
      margin-bottom: 2rem;
    }

    /* Body text */
    p {
      margin-bottom: 1.3rem;
    }

    a {
      color: #111;
    }

    /* Literary blockquote */
    blockquote {
      margin: 2.2rem 0;
      padding-left: 1.5rem;
      border-left: 1px solid #ccc;
      color: #222;
    }

    blockquote p {
      margin-bottom: 1.1rem;
    }

    /* Footer */
    .footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #555;
    }

    /* Mobile refinement */
    @media (max-width: 600px) {
      body {
        font-size: 17.5px;
      }

      main {
        padding: 88px 24px 84px;
      }

      .site-name {
        font-size: clamp(3.2rem, 14vw, 4.6rem);
      }

      h1 {
        font-size: clamp(1.7rem, 7vw, 2.1rem);
      }
    }
  </style>
</head>
<body>
  <main>

    <!-- Identity -->
    <div class="site-name">
      <a href="/">JW Baum</a>
    </div>

    <!-- Section -->
    <p class="section"><a href="/writing/">Writing</a></p>

    <!-- Title -->
    <h1>Your Essay Title</h1>

    <!-- Date -->
    <time class="date" datetime="2024-01-10">2024-01-10</time>

    <!-- Original publication note -->
    <p class="original">
      Originally published as “Why I Still Read Slowly” (2024).
    </p>

    <!-- Body -->
    <p>Your opening paragraph...</p>

    <p>Another paragraph...</p>

    <blockquote>
      <p>
        This is a blockquote — great for quotes, scripture, or emphasis.
      </p>
    </blockquote>

    <p>More writing...</p>

    <!-- Footer -->
    <p class="footer">
      © 2026 JW Baum
    </p>

  </main>
</body>
</html>
